<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TV • Banco Cidade</title><link rel="stylesheet" href="style.css"><main><h1>📺 BANCO CIDADE</h1><div class="row"><span class="pill">Sala: <b id="code"></b></span><span class="pill" id="turn">Aguardando...</span><span class="pill" id="dice"></span></div><div id="board" class="board"></div><div id="players" class="players"></div><section class="panel"><h2>📢 Últimos acontecimentos</h2><div id="log" class="logs"></div></section></main><script src="common.js"></script><script src="board.js"></script><script>$('#code').textContent=room;async function refresh(){try{let s=await api('state',{room});renderBoard(s);$('#turn').textContent=s.started?'Vez de '+s.players[s.turn].name:'Aguardando início';$('#dice').textContent=s.dice.length?'🎲 '+s.dice.join(' + '):'';$('#players').innerHTML=s.players.map((p,i)=>'<div class="player '+(s.started&&i===s.turn?'active':'')+'" style="--pc:'+p.color+'">'+p.name+' • '+money(p.money)+(p.jail?' 🔒':'')+'</div>').join('');$('#log').innerHTML=s.log.slice().reverse().map(x=>'<p>'+x+'</p>').join('')}catch(e){$('#turn').textContent=e.message}}refresh();setInterval(refresh,1000)</script></html>

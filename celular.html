<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jogador • Banco Cidade</title><link rel="stylesheet" href="style.css"><main><h1>📱 Meu jogo</h1><div class="panel"><h2>Sala <span id="code"></span></h2><div id="join"><input id="name" placeholder="Seu nome" maxlength="20"><p>Escolha seu peão:</p><div id="colors" class="colors"></div><button id="enter">Entrar na sala</button></div><div id="game" hidden><h2 id="identity"></h2><div class="row"><span class="pill" id="cash"></span><span class="pill" id="position"></span><span class="pill" id="turn"></span></div><p id="dice"></p><p id="card" class="notice" hidden></p><div id="actions"></div><h3>🏘️ Minhas propriedades</h3><div id="assets"></div></div><p id="status"></p></div><a href="/">← Página inicial</a></main><script src="common.js"></script><script>$('#code').textContent=room;let token=localStorage.getItem('banco_player_'+room),selected=null,lastState=null;const colors=['#ef4444','#3b82f6','#22c55e','#eab308','#a855f7','#f97316'];function colorsRender(s){$('#colors').innerHTML='';colors.forEach(c=>{let btn=document.createElement('button');btn.className='color'+(selected===c?' selected':'');btn.style.background=c;btn.disabled=s.players.some(p=>p.color===c);btn.onclick=()=>{selected=c;colorsRender(s)};$('#colors').append(btn)})}$('#enter').onclick=async()=>{try{let x=await api('join',{room,name:$('#name').value,color:selected});token=x.token;localStorage.setItem('banco_player_'+room,token);refresh()}catch(e){showErr(e)}};async function act(a,params={}){try{await api(a,{room,token,...params});refresh()}catch(e){showErr(e)}}function btn(label,action,params={}){let b=document.createElement('button');b.textContent=label;b.onclick=()=>act(action,params);$('#actions').append(b)}async function refresh(){try{let s=await api('state',{room,token});lastState=s;$('#status').textContent=s.started?'Partida em andamento':'Aguardando o administrador iniciar a partida';if(s.me===null){$('#join').hidden=false;$('#game').hidden=true;colorsRender(s);return}$('#join').hidden=true;$('#game').hidden=false;let p=s.players[s.me];$('#identity').textContent='● '+p.name;$('#identity').style.color=p.color;$('#cash').textContent='💰 '+money(p.money);$('#position').textContent='📍 '+s.board[p.pos].name;$('#turn').textContent=s.started?'Vez: '+s.players[s.turn].name:'Aguardando';$('#dice').textContent=s.dice.length?'🎲 '+s.dice.join(' + '):'';$('#card').hidden=!s.card;$('#card').textContent=s.card||'';$('#actions').innerHTML='';if(s.started&&s.turn===s.me){if(s.phase==='roll'){if(p.jail){btn('💵 Pagar R$ 50 e sair','payjail');if(p.free)btn('🃏 Usar saída livre','usefree')}btn('🎲 JOGAR DADOS','roll')}if(s.phase==='decide'&&s.offer!==null){let t=s.board[s.offer];let info=document.createElement('p');info.textContent='Comprar '+t.name+' por '+money(t.price)+'?';$('#actions').append(info);btn('🏠 Comprar','buy');btn('Não comprar','pass')}if(s.phase==='end')btn('➡️ Encerrar jogada','end')}let assets=Object.entries(s.owners).filter(([id,a])=>a.owner===s.me);$('#assets').innerHTML='';assets.forEach(([id,a])=>{let t=s.board[+id],div=document.createElement('div');div.className='asset';div.textContent=t.name+' • '+a.houses+' construções'+(a.mortgaged?' • HIPOTECADO':'');if(t.kind==='property'&&!a.mortgaged&&a.houses<5){let b=document.createElement('button');b.textContent='Construir ('+money(Math.max(50,t.price/2|0))+')';b.onclick=()=>act('build',{pos:+id});div.append(b)}let b=document.createElement('button');b.className='secondary';b.textContent=a.mortgaged?'Quitar hipoteca':'Hipotecar';b.onclick=()=>act(a.mortgaged?'unmortgage':'mortgage',{pos:+id});div.append(b);$('#assets').append(div)})}catch(e){$('#status').textContent=e.message}}refresh();setInterval(refresh,1300)</script></html>

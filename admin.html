<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin • Banco Cidade</title><link rel="stylesheet" href="style.css"><main><h1>👑 Administrador</h1><div class="panel"><h2>Sala <span id="code"></span></h2><div class="links"><a id="tv" target="_blank">📺 Abrir TV</a><a id="player" target="_blank">📱 Link do jogador</a><a href="/">🏠 Início</a></div><p id="status">Carregando...</p><div id="players" class="players"></div><button id="start">Iniciar / Reiniciar partida</button></div><p class="small">Para criar uma nova sala, use a página inicial. Mantenha o mesmo navegador para preservar seu acesso de administrador.</p></main><script src="common.js"></script><script>$('#code').textContent=room;$('#tv').href='tv.html?room='+room;$('#player').href='celular.html?room='+room;let token=localStorage.getItem('banco_admin_'+room);$('#start').onclick=async()=>{if(!confirm('Iniciar ou reiniciar a partida?'))return;try{await api('start',{room,token});refresh()}catch(e){showErr(e)}};async function refresh(){try{let s=await api('state',{room,token});$('#status').textContent=s.started?'Partida em andamento':'Aguardando jogadores (mínimo 2)';$('#players').innerHTML=s.players.map(p=>'<div class="player" style="--pc:'+p.color+'">'+p.name+'</div>').join('');$('#start').disabled=!s.admin||s.players.length<2;if(!s.admin)$('#status').textContent+=' • Sem autorização de administrador neste navegador'}catch(e){$('#status').textContent=e.message}}refresh();setInterval(refresh,1800)</script></html>

<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Banco Cidade Online</title><link rel="stylesheet" href="style.css"><main><h1>🏙️ BANCO CIDADE ONLINE</h1><p>O jogo de propriedades, construções e negociações inspirado nas cidades brasileiras.</p><section class="panel"><h2>👑 Criar sala</h2><button id="create">Criar nova sala</button><p id="created"></p></section><section class="panel"><h2>🔑 Entrar em uma sala</h2><input id="code" placeholder="Código da sala" maxlength="5"><div class="links"><button id="admin">Administrador</button><button id="tv">TV</button><button id="player">Jogador</button></div></section><p class="small">Versão inicial jogável: compra, aluguel, construção, hipoteca, prisão, cartas e dados. Negociações e falência serão implementadas na próxima versão.</p></main><script src="common.js"></script><script>$('#create').onclick=async()=>{try{let x=await api('create');localStorage.setItem('banco_admin_'+x.room,x.token);$('#created').innerHTML='Sala criada: <b>'+x.room+'</b>';go('admin.html',x.room)}catch(e){showErr(e)}};for(let p of ['admin','tv','player'])$('#'+p).onclick=()=>{let c=$('#code').value.trim().toUpperCase();if(!c)return alert('Informe o código da sala');go(p==='player'?'celular.html':p+'.html',c)};</script></html>
